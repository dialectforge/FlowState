[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowstatemcp"
version = "2.5.0"
description = "Local-first shared project memory for AI apps (MCP server)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "John Martin" }
]
keywords = ["mcp", "model-context-protocol", "ai", "memory", "sqlite", "local-first", "flowstatemcp"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Environment :: Console",
]
dependencies = [
    "mcp>=1.30,<2",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://flowstatemcp.com"
Repository = "https://github.com/dialectforge/FlowState"
Changelog = "https://github.com/dialectforge/FlowState/blob/main/CHANGELOG.md"
Hosted = "https://flowstatemcp.com/hosted"

[project.optional-dependencies]
# The off-site encryption needs `cryptography`. `mcp` already brings it, so it is listed here, not
# in `dependencies`. (2.4.4 changes `dependencies` anyway: mcp>=1.30 for two security advisories,
# so `flowstate update` to 2.4.4 makes a new .venv.)
offsite = [
    "cryptography>=42",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27",
    "httpx2",
]
embeddings = [
    "sentence-transformers>=2.2.0",
    "sqlite-vec>=0.1.0",
]

[project.scripts]
flowstate = "flowstate.server:main"
flowstatemcp = "flowstate.server:main"

[tool.hatch.build.targets.wheel]
packages = ["flowstate"]
